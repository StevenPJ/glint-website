<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" fill="none">
  <defs>
    <!-- Gradient for G letter -->
    <linearGradient id="gGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1"/>
      <stop offset="50%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#42A5F5"/>
    </linearGradient>
    <!-- Gradient for L letter -->
    <linearGradient id="lGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#42A5F5"/>
    </linearGradient>
    <!-- Gradient for I dot/sparkle -->
    <linearGradient id="sparkleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4"/>
      <stop offset="100%" style="stop-color:#26C6DA"/>
    </linearGradient>
  </defs>

  <!-- G Letter with wave -->
  <g transform="translate(20, 15)">
    <!-- Outer G shape -->
    <path d="M45 0C20.1 0 0 20.1 0 45s20.1 45 45 45c15.5 0 29.2-7.9 37.3-19.8V45H50v12h20v8.5C63.5 74.3 54.8 78 45 78c-18.2 0-33-14.8-33-33s14.8-33 33-33c9.1 0 17.4 3.7 23.3 9.7l8.5-8.5C68.2 4.5 57.2 0 45 0z" fill="url(#gGradient)"/>
    <!-- Wave inside G -->
    <path d="M25 45c0-11 9-20 20-20 5.5 0 10.5 2.2 14.1 5.9l-14.1 14.1-8.5-8.5c-2.3 2.3-3.8 5.5-3.8 9 0 7 5.7 12.7 12.7 12.7 3.5 0 6.7-1.4 9-3.8l8.5 8.5C58.2 67.6 52.2 70 45.4 70 34 70 25 60.4 25 49v-4z" fill="#4DD0E1" opacity="0.9"/>
  </g>

  <!-- L Letter -->
  <text x="108" y="82" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="url(#lGradient)">L</text>

  <!-- I Letter (stem only, dot is sparkle) -->
  <rect x="158" y="28" width="12" height="54" fill="#37474F"/>

  <!-- Sparkle/Diamond above I -->
  <g transform="translate(164, 8)">
    <!-- Main diamond -->
    <path d="M0 10L6 0L12 10L6 20Z" fill="url(#sparkleGradient)"/>
    <!-- Small sparkle accents -->
    <path d="M6 -4L7 0L6 4L5 0Z" fill="#26C6DA"/>
    <path d="M-2 10L2 9L6 10L2 11Z" fill="#26C6DA"/>
    <path d="M6 10L10 9L14 10L10 11Z" fill="#26C6DA"/>
  </g>

  <!-- N Letter -->
  <text x="180" y="82" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#37474F">N</text>

  <!-- T Letter -->
  <text x="240" y="82" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#546E7A">T</text>

  <!-- Tagline: Advancing Gastroenterology Research Across London -->
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="11" fill="#546E7A" text-anchor="middle" letter-spacing="0.5">Advancing Gastroenterology Research Across London</text>

  <!-- Tagline: Collaborate | Innovate | Impact -->
  <text x="200" y="122" font-family="Arial, sans-serif" font-size="10" fill="#78909C" text-anchor="middle" font-style="italic" letter-spacing="0.3">Collaborate | Innovate | Impact</text>
</svg>

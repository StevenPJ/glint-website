<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Favicon icon (centered vertically) -->
  <g transform="translate(0, 4) scale(1)">
    <!-- Central node -->
    <circle cx="16" cy="16" r="5" fill="#0F4C75"/>
    <!-- Surrounding nodes -->
    <circle cx="6" cy="6" r="3" fill="#3282B8"/>
    <circle cx="26" cy="6" r="3" fill="#3282B8"/>
    <circle cx="6" cy="26" r="3" fill="#3282B8"/>
    <circle cx="26" cy="26" r="3" fill="#3282B8"/>
    <!-- Connection lines -->
    <line x1="11" y1="11" x2="9" y2="9" stroke="#BBE1FA" stroke-width="1.5"/>
    <line x1="21" y1="11" x2="23" y2="9" stroke="#BBE1FA" stroke-width="1.5"/>
    <line x1="11" y1="21" x2="9" y2="23" stroke="#BBE1FA" stroke-width="1.5"/>
    <line x1="21" y1="21" x2="23" y2="23" stroke="#BBE1FA" stroke-width="1.5"/>
    <!-- Sparkle -->
    <path d="M16 11 L16.5 14 L19 14.5 L16.5 15 L16 18 L15.5 15 L13 14.5 L15.5 14 Z" fill="white" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="40" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" letter-spacing="4" fill="url(#logoGradient)" dominant-baseline="central">GLINT</text>
</svg>

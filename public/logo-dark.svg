  <path d="M8 30C8 17.85 17.85 8 30 8C38.5 8 45.8 12.8 49.5 19.8L43.5 23.5C41 18.5 36 15 30 15C21.7 15 15 21.7 15 30C15 38.3 21.7 45 30 45C36 45 41 41.5 43.5 36.5H32V30H52V32C52 44.15 42.15 54 30 54C17.85 54 8 44.15 8 30Z" fill="url(#gGradientDark)"/>


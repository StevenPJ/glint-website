<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <!-- Gradient for accent/sparkle -->
    <linearGradient id="tealGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- G gradient -->
    <linearGradient id="gGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <!-- L gradient -->
    <linearGradient id="lGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#CFFAFE"/>
    </linearGradient>
    <!-- I gradient -->
    <linearGradient id="iGradientLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <!-- N gradient -->
    <linearGradient id="nGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <!-- T gradient -->
    <linearGradient id="tGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- G Letter -->
  <path d="M8 30C8 17.85 17.85 8 30 8C38.5 8 45.8 12.8 49.5 19.8L43.5 23.5C41 18.5 36 15 30 15C21.7 15 15 21.7 15 30C15 38.3 21.7 45 30 45C36 45 41 41.5 43.5 36.5H32V30H52V32C52 44.15 42.15 54 30 54C17.85 54 8 44.15 8 30Z" fill="url(#gGradientLight)"/>

  <!-- L Letter -->
  <path d="M62 10H70V46H92V54H62V10Z" fill="url(#lGradientLight)"/>

  <!-- I Letter (stem) -->
  <rect x="102" y="18" width="8" height="36" fill="url(#iGradientLight)"/>

  <!-- Sparkle/Diamond above I -->
  <path d="M106 4L110 10L106 16L102 10L106 4Z" fill="url(#tealGradientLight)"/>
  <!-- Small sparkle rays -->
  <path d="M106 0L107 3L106 6L105 3Z" fill="#5EEAD4" opacity="0.8"/>
  <path d="M98 10L101 9L104 10L101 11Z" fill="#5EEAD4" opacity="0.8"/>
  <path d="M108 10L111 9L114 10L111 11Z" fill="#5EEAD4" opacity="0.8"/>

  <!-- N Letter -->
  <path d="M120 10H128L148 42V10H156V54H148L128 22V54H120V10Z" fill="url(#nGradientLight)"/>

  <!-- T Letter -->
  <path d="M166 10H206V18H190V54H182V18H166V10Z" fill="url(#tGradientLight)"/>
